[project]
name = "ab-capacity-backend"
version = "0.1.0"
description = "Alberta School Capacity & Utilization Planning Platform: API and data pipeline"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.120",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.44",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "typer>=0.20",
    "pyyaml>=6.0",
    "pandas>=2.3",
    "openpyxl>=3.1",
    "rapidfuzz>=3.14.6",
    "geopandas>=1.2.0",
    "shapely>=2.2.0",
    "pyogrio>=0.13.0",
    "geoalchemy2>=0.21.0",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[project.scripts]
abcap = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs PostgreSQL (skipped when unreachable unless REQUIRE_DB=1)"]
