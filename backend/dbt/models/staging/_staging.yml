version: 2

models:
  - name: stg_enrolment__school
    description: School enrolment, one row per school per school year (wide).
    data_tests:
      - unique_combination:
          arguments:
            columns: [school_code, school_year]
    columns:
      - name: school_code
        data_tests: [not_null]
      - name: authority_type
        data_tests:
          - accepted_values:
              arguments:
                values: [public, separate, francophone, charter, private, provincial]

  - name: stg_enrolment__authority
    description: Authority enrolment, one row per authority per school year.
    data_tests:
      - unique_combination:
          arguments:
            columns: [authority_code, school_year]

  - name: stg_enrolment__school_grade
    description: School enrolment unpivoted to one row per grade.

  - name: stg_capacity__facility_row
    description: Capacity file rows with normalized name keys for matching.
    columns:
      - name: capacity_row_id
        data_tests: [unique, not_null]

  - name: stg_geo__authority_boundary
    columns:
      - name: authority_code
        data_tests: [unique, not_null]

  - name: stg_geo__school_point
    columns:
      - name: school_code
        data_tests: [unique]
