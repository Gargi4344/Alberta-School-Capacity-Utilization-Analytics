name: ab_capacity
version: "1.0.0"
profile: ab_capacity
config-version: 2

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "logs"]

vars:
  # Passed by `abcap run` from UTILIZATION_THRESHOLD_PCT / OVER_CAPACITY_PCT (as ratios).
  utilization_threshold: 0.85
  over_capacity_threshold: 1.0
  # School years flagged preliminary. Empty list = the latest year only.
  preliminary_school_years: []

models:
  ab_capacity:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: view
    marts:
      +schema: mart
      +materialized: table

seeds:
  ab_capacity:
    +schema: staging
