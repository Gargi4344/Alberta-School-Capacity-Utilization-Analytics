name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config -q
      - name: Database starts with PostGIS and schemas
        run: |
          docker compose up -d --wait db
          docker compose exec -T db psql -U abcap -d abcap -tAc \
            "SELECT postgis_lib_version(), (SELECT count(*) FROM pg_namespace WHERE nspname IN ('raw','staging','mart','ops'))"
