name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: abcap
          POSTGRES_PASSWORD: abcap
          POSTGRES_DB: abcap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abcap -d abcap"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://abcap:abcap@localhost:5432/abcap
      TEST_DATABASE_URL: postgresql+psycopg://abcap:abcap@localhost:5432/abcap_test
      REQUIRE_DB: "1" # database tests must run in CI, never be skipped
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test (unit + database)
        run: uv run pytest -q
      - name: Pipeline on committed sample (offline)
        run: |
          uv run abcap migrate
          uv run abcap run --source sample
          uv run abcap verify --source sample

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate docker-compose.yml
        run: cp .env.example .env && docker compose config -q
      - name: Database and API start
        run: |
          docker compose up -d --wait --build
          docker compose exec -T db psql -U abcap -d abcap -tAc \
            "SELECT postgis_lib_version(), (SELECT count(*) FROM pg_namespace WHERE nspname IN ('raw','staging','mart','ops'))"
          curl -fsS http://localhost:8000/api/v1/health
